<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ product.name }}{% endblock %}</title>
  {% block head %}{% endblock %}
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {# A fan page wears its creator's colour; every other page, ours. #}
  <main class="page" style="--accent: {{ creator.accent_color if creator is defined and creator else '#333333' }}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
