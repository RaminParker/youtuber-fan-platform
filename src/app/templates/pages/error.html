{% extends "pages/base.html" %}
{% block title %}{{ heading }} — {{ product.name }}{% endblock %}
{% block content %}
  {# An outcome page announces itself: role="status" for a result, "alert" for a refusal. #}
  <div{% if role is defined %} role="{{ role }}"{% endif %}>
    <h1>{{ heading }}</h1>
    <p>{{ message }}</p>
  </div>
{% endblock %}
