[project]
name = "creator-platform"
version = "0.1.0"
description = "Summaries of what a creator said publicly, delivered to their fans by e-mail."
requires-python = "==3.13.*"

dependencies = [
    # Web
    "fastapi==0.141.0",
    "starlette==1.6.0",
    "uvicorn[standard]==0.41.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.20",
    "itsdangerous==2.2.0",
    "slowapi==0.1.10",
    # Database
    "sqlalchemy==2.0.52",
    "psycopg[binary]==3.3.5",
    "alembic==1.19.0",
    # Configuration
    "pydantic==2.13.0",
    "pydantic-settings==2.15.0",
    # Outbound HTTP: YouTube Data API, Google OAuth, Resend, the LLM gateway
    "httpx==0.28.1",
    # Transcripts (unofficial provider)
    "youtube-transcript-api==1.2.4",
    # E-mail rendering
    "css-inline==0.21.0",
    # Secrets at rest
    "cryptography==50.0.0",
    # Observability
    "structlog==26.1.0",
    "sentry-sdk[fastapi]==2.44.0",
]

[project.scripts]
app = "app.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest==8.4.2",
    "ruff==0.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "UP",          # pyupgrade
    "B",           # bugbear
    "SIM",         # simplify
    "D",           # pydocstyle (numpy convention, see below)
    "RUF",
]
ignore = [
    "D105",  # magic methods need no docstring
    "D107",  # __init__ is documented on the class
    "E501",  # line length is ruff-format's job
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-bugbear]
# Depends() in a default is FastAPI's documented way of declaring a dependency,
# not the mutable-default trap B008 is about.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Form", "fastapi.Header"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]           # test names are the documentation
"migrations/*" = ["D", "I"] # generated by alembic

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: needs a PostgreSQL database (DATABASE_URL_TEST)"]
